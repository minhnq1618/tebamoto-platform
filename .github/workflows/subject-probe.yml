name: subject-probe
on:
  push:
permissions:
  id-token: write
  contents: read
jobs:
  copilot:
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - name: Probe copilot subject
        env:
          CID: 72ff278a-9e71-43ec-bac4-2ca303f8e462
          TID: 3205c325-06a5-4171-9ce8-ffc5e6c2845e
        run: bash ci/subject-probe.sh copilot "$CID" "$TID"
  plain:
    runs-on: ubuntu-latest
    steps:
      - name: Probe plain subject
        env:
          CID: 72ff278a-9e71-43ec-bac4-2ca303f8e462
          TID: 3205c325-06a5-4171-9ce8-ffc5e6c2845e
        run: bash ci/subject-probe.sh plain "$CID" "$TID"
